[project]
name = "independent-intelligence-engine"
version = "0.1.0"
description = "Local research, invention, and commercial evaluation engine with evidence grading and critical review."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
iie = "iie.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iie*"]

[tool.setuptools.package-data]
iie = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
